<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행사 참여명단 취합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 레이아웃: 상단 바 + 탭, 본문은 달력(넓게) + 선택일 패널(좁게). 휴대폰에서는 한 줄로 쌓임 */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#f8faf7; --ink:#1c2420; --muted:#5d6a63; --line:#dce2da;
  --accent:#2e5b4e; --accent-ink:#ffffff; --accent-soft:#e2ece6;
  --pending:#a8650f; --pending-soft:#fbf0dc;
  --danger:#b42318; --danger-soft:#fdeceb;
  --sun:#c2372b; --sat:#2b58a0; --today:#f6e7b4;
  --shadow:0 1px 2px rgba(28,36,32,.06),0 8px 24px rgba(28,36,32,.08);
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1a201d; --surface-2:#161c19; --ink:#e6ece8; --muted:#9aa7a0; --line:#2c3631;
    --accent:#86c4ae; --accent-ink:#0e1a15; --accent-soft:#20322a;
    --pending:#e3a94d; --pending-soft:#36291a; --danger:#f2897d; --danger-soft:#3a1f1c;
    --sun:#f2897d; --sat:#8db2f0; --today:#3b3420; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a201d; --surface-2:#161c19; --ink:#e6ece8; --muted:#9aa7a0; --line:#2c3631;
  --accent:#86c4ae; --accent-ink:#0e1a15; --accent-soft:#20322a;
  --pending:#e3a94d; --pending-soft:#36291a; --danger:#f2897d; --danger-soft:#3a1f1c;
  --sun:#f2897d; --sat:#8db2f0; --today:#3b3420; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 상단 */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .me{font-size:14px;color:var(--muted)}
.who .me b{color:var(--ink);font-weight:600}
.mode-tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tabs{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{font-size:12px;margin-left:4px;color:var(--accent)}
.demo{background:var(--pending-soft);color:var(--ink);font-size:13px}
.demo div{max-width:1240px;margin:0 auto;padding:8px 16px}
main{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{width:34px;height:34px;padding:0;font-size:18px}

/* 상태 표시 */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--accent);color:var(--accent-ink)}
.pill.draft{background:var(--pending-soft);color:var(--pending);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pending) 35%,transparent)}
.pill.out{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* 달력 */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal{padding:16px}
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{font:700 24px/1.2 var(--f-display);margin:0 6px;min-width:150px;text-align:center}
.cal-head .grow{flex:1}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend .l-done{background:var(--accent)}
.legend .l-draft{background:var(--pending-soft);box-shadow:inset 0 0 0 1px var(--pending)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.wd{font-size:12px;font-weight:600;text-align:center;padding:6px 0;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.wd.sun{color:var(--sun)} .wd.sat{color:var(--sat)}
.cell{min-height:104px;padding:5px 5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:hover{background:var(--surface-2)}
.cell.other{background:var(--surface-2)}
.cell.other .d{opacity:.4}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .d{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.sun .d{color:var(--sun)} .cell.sat .d{color:var(--sat)}
.cell.today .d{background:var(--today)}
.chip{display:block;width:100%;text-align:left;border:0;font-size:12px;line-height:1.35;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{background:var(--accent);color:var(--accent-ink)}
.chip.draft{background:var(--pending-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--pending)}
.chip.mine{font-weight:700}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pending)}
.dots i.done{background:var(--accent)}

.side{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.side h3{margin:0;font-size:16px}
.side .sub{font-size:13px;color:var(--muted);margin-top:-8px}
.ev-list{display:flex;flex-direction:column;gap:8px}
.ev-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
.ev-item:hover{border-color:var(--accent)}
.ev-item .t{font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between}
.ev-item .m{font-size:13px;color:var(--muted)}
.empty{font-size:14px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:8px;text-align:center}

/* 섹션 공통 */
.sec-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font:700 22px/1.25 var(--f-display);margin:0}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sec-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* 내 담당 행사 */
.mine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mine-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.mine-card .date{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.mine-card h3{margin:0;font-size:17px;line-height:1.35}
.mine-card .meta{font-size:13px;color:var(--muted)}
.mine-card .count{display:flex;gap:14px;font-size:13px}
.mine-card .count b{font-size:18px;margin-right:2px}
.mine-card .btn{align-self:flex-start}
.mine-card.past{opacity:.8}

/* 표 */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
tr.dim td{color:var(--muted)}
tr.dim td.nm{text-decoration:line-through}

/* 명단 작성 */
.roster-top{padding:16px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.roster-top .info{flex:1;min-width:0}
.roster-top h2{font:700 22px/1.3 var(--f-display);margin:2px 0 4px}
.roster-top .meta{color:var(--muted);font-size:14px}
.notice{padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:12px}
.notice.ok{background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--pending-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.toolbar .hint{font-size:13px;color:var(--muted);margin-left:auto}
.paste{padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.paste textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2);font-size:14px}
.paste .h{font-size:13px;color:var(--muted)}
table.roster td{padding:4px 6px}
table.roster input[type=number],table.roster input[type=text],table.roster select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--surface);width:100%}
table.roster .w-s{width:72px} table.roster .w-n{min-width:120px}
table.roster tr.bad td{background:var(--danger-soft)}
table.roster input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.roster-foot{position:sticky;bottom:0;margin-top:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.roster-foot .sum{font-size:14px;margin-right:auto}
.roster-foot .sum b{font-size:17px}
.dirty{font-size:12px;color:var(--pending);font-weight:600}

/* 취합 */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{padding:10px 14px;min-width:110px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:14px;max-width:100%}
.filters input{min-width:180px}

/* 폼 */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);font-size:15px;width:100%}
.field .help{font-size:12px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.consent{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.consent input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.consent label{font-size:14px;font-weight:600;cursor:pointer}
.consent details{font-size:12px;color:var(--muted);margin-top:4px}
.consent summary{cursor:pointer}
.consent dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.consent dt{font-weight:600}
.consent dd{margin:0}
.err{color:var(--danger);font-size:13px;min-height:1em}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(12,18,15,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal header{padding:18px 20px 0;display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font:700 19px/1.3 var(--f-display);flex:1}
.modal .body{padding:16px 20px}
.modal footer{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--danger);color:#fff}
.loading{padding:40px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .cal-layout{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:640px){
  .cell{min-height:58px;padding:3px}
  .cell .chip,.cell .more{display:none}
  .dots{display:flex}
  .cal-head h2{font-size:20px;min-width:0}
  .row2{grid-template-columns:1fr}
  .brand h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><h1>행사 참여명단 취합</h1></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</header>
<div class="demo" id="demo" hidden><div><b>미리보기 모드</b> · 구글 시트에 연결되지 않아 새로고침하면 입력 내용이 사라집니다. 예시 교사 <b>박지훈</b>으로 로그인해 보세요.</div></div>
<main id="view"><div class="loading">불러오는 중…</div></main>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= 서버 연결 ================= */
const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (HAS_GAS) {
    return new Promise(function (res, rej) {
      const runner = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
        rej(new Error(String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '')));
      });
      runner[fn].apply(runner, args);
    });
  }
  return new Promise(function (res, rej) {
    setTimeout(function () {
      try { res(JSON.parse(JSON.stringify(Mock[fn].apply(null, args)))); } catch (e) { rej(e); }
    }, 120);
  });
}

/* ================= 공통 ================= */
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const DEPTS = ['교무기획부', '교육과정부', '교육연구부', '학생생활안전부', '진로진학부', '창의인성부', '방과후학교부', '정보교육부', '과학교육부', '1학년부', '2학년부', '3학년부', '행정실'];
const pad = n => String(n).padStart(2, '0');
const keyOf = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
const today = new Date();
const TODAY = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
const norm = s => String(s == null ? '' : s).replace(/\s+/g, '');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(k, withYear) {
  if (!k) return '';
  const p = k.split('-').map(Number); const d = new Date(p[0], p[1] - 1, p[2]);
  return (withYear ? p[0] + '년 ' : '') + p[1] + '월 ' + p[2] + '일 (' + WD[d.getDay()] + ')';
}
function statusPill(ev) {
  return ev.status === '확정' ? '<span class="pill done">최종확정</span>' : '<span class="pill draft">신청 접수중</span>';
}
function rowStatusPill(s) {
  return s === '확정' ? '<span class="pill done">확정</span>' : s === '미선정' ? '<span class="pill out">미선정</span>' : '<span class="pill draft">신청</span>';
}

let toastTimer;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 4500 : 2600);
}
function fail(e) { toast((e && e.message) || '요청을 처리하지 못했습니다. 잠시 후 다시 시도하세요.', true); }

/* ================= 상태 ================= */
const S = {
  events: [], mode: 'guest', me: null, pw: '',
  view: 'calendar', y: today.getFullYear(), m: today.getMonth(), sel: TODAY,
  roster: null, agg: null, aggF: { status: 'all', event: 'all', grade: 'all', q: '' }, evQ: ''
};

function myEvents() {
  if (S.mode !== 'teacher') return [];
  return S.events.filter(e => norm(e.teacher) === norm(S.me.name));
}
function evById(id) { return S.events.find(e => e.id === id); }

/* ================= 모달 ================= */
function openModal(html, onMount) {
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="overlay" data-close-overlay><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  const first = root.querySelector('input:not([type=checkbox]),select,button.primary');
  if (onMount) onMount(root.querySelector('.modal'));
  if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
document.getElementById('modal-root').addEventListener('mousedown', e => { if (e.target.hasAttribute('data-close-overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function ask(title, msg, okLabel, danger) {
  return new Promise(resolve => {
    openModal('<header><h3>' + esc(title) + '</h3></header><div class="body" style="font-size:15px">' + msg + '</div>' +
      '<footer><button class="btn" id="ask-no">취소</button><button class="btn ' + (danger ? 'danger solid' : 'primary') + '" id="ask-yes">' + esc(okLabel) + '</button></footer>',
      m => {
        m.querySelector('#ask-no').onclick = () => { closeModal(); resolve(false); };
        m.querySelector('#ask-yes').onclick = () => { closeModal(); resolve(true); };
      });
  });
}

/* ================= 상단 / 탭 ================= */
function renderTop() {
  const who = document.getElementById('who');
  if (S.mode === 'guest') {
    who.innerHTML = '<button class="btn primary" data-act="login-teacher">교사 로그인</button><button class="btn" data-act="login-admin">관리자</button>';
  } else if (S.mode === 'teacher') {
    who.innerHTML = '<span class="me">' + esc(S.me.dept) + ' · <b>' + esc(S.me.name) + '</b> 선생님</span><button class="btn sm" data-act="logout">로그아웃</button>';
  } else {

  }
  const tabs = document.getElementById('tabs');

  if (S.mode === 'teacher') list = [['calendar', '행사 달력'], ['mine', '내 담당 행사', myEvents().length]];
  if (S.mode === 'admin') list = [['calendar', '행사 달력'], ['events', '행사 관리', S.events.length], ['agg', '참여학생 취합'], ['settings', '설정']];
  tabs.hidden = !list.length;
  const cur = S.view === 'roster' ? (S.mode === 'admin' ? 'events' : 'mine') : S.view;
  tabs.innerHTML = list.map(t => '<button class="tab" role="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (cur === t[0]) + '">' + t[1] +

}

function render() {
  renderTop();
  const v = document.getElementById('view');
  if (S.view === 'calendar') v.innerHTML = viewCalendar();
  else if (S.view === 'mine') v.innerHTML = viewMine();
  else if (S.view === 'roster') v.innerHTML = viewRoster();
  else if (S.view === 'events') v.innerHTML = viewEvents();
  else if (S.view === 'agg') v.innerHTML = viewAgg();
  else if (S.view === 'settings') v.innerHTML = viewSettings();
}

/* ================= 달력 ================= */
function viewCalendar() {
  const y = S.y, m = S.m;
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((first + days) / 7) * 7;
  const byDate = {};
  S.events.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  const mineIds = new Set(myEvents().map(e => e.id));
  let cells = WD.map((w, i) => '<div class="wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>').join('');
  for (let i = 0; i < total; i++) {
    const dt = new Date(y, m, i - first + 1);
    const k = keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
    const evs = byDate[k] || [];
    const cls = ['cell', dt.getMonth() !== m ? 'other' : '', dt.getDay() === 0 ? 'sun' : dt.getDay() === 6 ? 'sat' : '', k === TODAY ? 'today' : '', k === S.sel ? 'sel' : ''].join(' ');
    const chips = evs.slice(0, 3).map(e => '<button class="chip ' + (e.status === '확정' ? 'done' : 'draft') + (mineIds.has(e.id) ? ' mine' : '') +
      '" data-act="event" data-id="' + e.id + '" title="' + esc(e.name + ' · ' + e.dept + ' · ' + e.teacher) + '">' + esc(e.name) + '</button>').join('');
    const more = evs.length > 3 ? '<span class="more">+' + (evs.length - 3) + '건 더</span>' : '';
    const dots = evs.length ? '<span class="dots">' + evs.map(e => '<i class="' + (e.status === '확정' ? 'done' : '') + '"></i>').join('') + '</span>' : '';
    cells += '<div class="' + cls + '" data-act="pick" data-date="' + k + '"><span class="d num">' + dt.getDate() + '</span>' + chips + more + dots + '</div>';
  }
  const selEvs = byDate[S.sel] || [];
  const canAdd = S.mode !== 'guest';
  const side = '<aside class="card side"><h3>' + fmtDate(S.sel) + '</h3><div class="sub">' + (selEvs.length ? '행사 ' + selEvs.length + '건' : '등록된 행사가 없습니다') + '</div>' +
    '<div class="ev-list">' + selEvs.map(evItem).join('') + '</div>' +
    (canAdd ? '<button class="btn primary" data-act="new-event" data-date="' + S.sel + '">이 날짜에 행사 등록</button>'
            : '<div class="empty">행사를 등록하거나 참여 명단을 작성하려면<br>먼저 로그인하세요.</div>') + '</aside>';
  return '<div class="cal-layout"><section class="card cal">' +
    '<div class="cal-head"><button class="btn icon-btn" data-act="prev" aria-label="이전 달">‹</button><h2 class="num">' + y + '년 ' + (m + 1) + '월</h2>' +
    '<button class="btn icon-btn" data-act="next" aria-label="다음 달">›</button><button class="btn sm ghost" data-act="today">오늘</button><span class="grow"></span>' +
    '<span class="legend"><span><i class="l-draft"></i>신청 접수중</span><span><i class="l-done"></i>최종확정</span></span>' +
    (canAdd ? '<button class="btn primary sm" data-act="new-event" data-date="' + S.sel + '">+ 행사 등록</button>' : '') +
    '</div><div class="grid">' + cells + '</div></section>' + side + '</div>';
}
function evItem(e) {
  return '<button class="ev-item" data-act="event" data-id="' + e.id + '"><span class="t"><span>' + esc(e.name) + '</span>' + statusPill(e) + '</span>' +
    '<span class="m">' + esc(e.dept) + ' · ' + esc(e.teacher) + ' · 신청 <span class="num">' + e.applied + '</span>명</span></button>';
}

    btns = '<button class="btn danger" data-m="del">삭제</button>' + (e.status === '확정' ? '<button class="btn" data-m="unconfirm">확정 해제</button>' : '') +

function actor() { return S.mode === 'admin' ? { pw: S.pw } : { dept: S.me.dept, name: S.me.name }; }

async function deleteEvent(e) {

/* ================= 명단 작성 ================= */
function openRoster(id) {
  S.view = 'roster'; S.roster = null;
  document.getElementById('view').innerHTML = '<div class="loading">명단을 불러오는 중…</div>'; renderTop();
  api('getRoster', id).then(r => {
    S.roster = { event: r.event, rows: r.students.map(s => Object.assign({}, s)), dirty: false, bad: {}, paste: false };
    if (!S.roster.rows.length && canEditRoster()) S.roster.rows.push(blankRow());
    render();
  }).catch(e => { fail(e); S.view = S.mode === 'admin' ? 'events' : 'mine'; render(); });
}
function canEditRoster() {
  const r = S.roster; if (!r) return false;
  if (S.mode === 'admin') return true;
  return S.mode === 'teacher' && norm(r.event.teacher) === norm(S.me.name) && r.event.status !== '확정';
}
function blankRow() {
  const rows = S.roster ? S.roster.rows : [];
  const last = rows[rows.length - 1];
  return { grade: last ? last.grade : '', cls: last ? last.cls : '', num: last && last.num ? Number(last.num) + 1 : '', name: '', selected: true };
}
function viewRoster() {
  const r = S.roster; if (!r) return '<div class="loading">불러오는 중…</div>';
  const e = r.event, edit = canEditRoster(), done = e.status === '확정';
  const applied = r.rows.filter(x => x.name).length, sel = r.rows.filter(x => x.name && x.selected).length;
  let notice = '';
  if (done && S.mode !== 'admin') notice = '<div class="notice ok"><b>최종확정된 명단입니다</b> (' + esc(e.confirmedAt) + '). 관리자 취합표에 최종 명단으로 표시됩니다. 수정이 필요하면 관리자에게 확정 해제를 요청하세요.</div>';
  else if (done) notice = '<div class="notice ok"><b>최종확정된 명단</b> (' + esc(e.confirmedAt) + ') · 관리자는 확정 상태에서도 수정할 수 있습니다.</div>';

function updateSum() {

function parsePaste(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    const t = line.trim().split(/\t+|,|\s+/).map(x => x.trim()).filter(Boolean);
    if (!t.length) return;
    const n = x => parseInt(String(x).replace(/[^0-9]/g, ''), 10);
    if (t.length >= 4 && !isNaN(n(t[0])) && !isNaN(n(t[1])) && !isNaN(n(t[2]))) {
      out.push({ grade: n(t[0]), cls: n(t[1]), num: n(t[2]), name: t.slice(3).join(' '), selected: true });
    } else if (t.length >= 2 && /^\d{4,5}$/.test(t[0])) {
      const s = t[0];
      out.push({ grade: Number(s[0]), cls: Number(s.slice(1, s.length - 2)), num: Number(s.slice(-2)), name: t.slice(1).join(' '), selected: true });
    }
  });
  return out;
}
function cleanRows() {
  const r = S.roster; r.bad = {};
  const rows = [], seen = {}; let msg = '';
  r.rows.forEach((s, i) => {
    const blank = !s.name && !s.cls && !s.num;
    if (blank) return;
    const g = parseInt(s.grade, 10), c = parseInt(s.cls, 10), n = parseInt(s.num, 10), name = String(s.name || '').trim();
    let e = '';
    if (!(g >= 1 && g <= 6)) e = '학년'; else if (!(c >= 1 && c <= 30)) e = '반'; else if (!(n >= 1 && n <= 99)) e = '번호'; else if (!name) e = '이름';
    const k = g + '-' + c + '-' + n;
    if (!e && seen[k] != null) { e = 'dup'; r.bad[seen[k]] = true; }
    if (e) { r.bad[i] = true; if (!msg) msg = e === 'dup' ? g + '학년 ' + c + '반 ' + n + '번이 두 번 입력되었습니다.' : (i + 1) + '번째 줄의 ' + e + '을(를) 확인하세요.'; return; }
    seen[k] = i;
    rows.push({ grade: g, cls: c, num: n, name: name, selected: !!s.selected });
  });
  return { rows, msg };
}
async function saveRoster(confirm) {

    S.view = v; render(); if (v === 'agg' && !S.agg) loadAgg();
  }
  else if (a === 'prev' || a === 'next') { S.m += a === 'prev' ? -1 : 1; if (S.m < 0) { S.m = 11; S.y--; } if (S.m > 11) { S.m = 0; S.y++; } render(); }
  else if (a === 'today') { S.y = today.getFullYear(); S.m = today.getMonth(); S.sel = TODAY; render(); }
  else if (a === 'pick') {
    S.sel = t.dataset.date; const p = S.sel.split('-').map(Number);
    if (p[1] - 1 !== S.m) { S.y = p[0]; S.m = p[1] - 1; }
    render();
  }
  else if (a === 'event') showEvent(id);
  else if (a === 'new-event') eventForm(null, t.dataset.date);
  else if (a === 'refresh') { api('getEvents').then(evs => { S.events = evs; render(); toast('최신 내용으로 불러왔습니다.'); }).catch(fail); }
  else if (a === 'roster') openRoster(id);
  else if (a === 'edit') eventForm(evById(id));
  else if (a === 'del') deleteEvent(evById(id));
  else if (a === 'unconfirm') unconfirmEvent(evById(id));
  else if (a === 'back') leaveRoster(S.mode === 'admin' ? 'events' : 'mine');
  else if (a === 'row-add') { S.roster.rows.push(blankRow()); S.roster.dirty = true; render(); const ins = document.querySelectorAll('table.roster tbody tr:last-child input[data-f=name]'); if (ins[0]) ins[0].focus(); }
  else if (a === 'row-del') { S.roster.rows.splice(Number(t.dataset.i), 1); S.roster.dirty = true; S.roster.bad = {}; render(); }
  else if (a === 'row-sort') { S.roster.rows.sort((x, y) => (x.grade - y.grade) || (x.cls - y.cls) || (x.num - y.num)); S.roster.dirty = true; S.roster.bad = {}; render(); }
  else if (a === 'paste-toggle') { S.roster.paste = !S.roster.paste; render(); if (S.roster.paste) document.getElementById('paste-ta').focus(); }
  else if (a === 'paste-add') {
    const add = parsePaste(document.getElementById('paste-ta').value);
    if (!add.length) { toast('읽을 수 있는 줄이 없습니다. 학년·반·번호·이름 순서인지 확인하세요.', true); return; }
    const r = S.roster; r.rows = r.rows.filter(x => x.name || x.cls || x.num).concat(add); r.dirty = true; r.paste = false; r.bad = {};
    render(); toast(add.length + '명을 추가했습니다. 확인 후 저장하세요.');
  }
  else if (a === 'save') saveRoster(false);
  else if (a === 'confirm') saveRoster(true);
  else if (a === 'agg-refresh') { S.agg = null; render(); Promise.all([api('getEvents'), api('getAggregate', S.pw)]).then(r => { S.events = r[0]; S.agg = r[1]; render(); }).catch(fail); }
  else if (a === 'xlsx') downloadXlsx();
  else if (a === 'to-sheet') exportSheet();
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.f && S.view === 'roster' && S.roster) {
    const tr = el.closest('tr'); const i = Number(tr.dataset.i); const row = S.roster.rows[i]; if (!row) return;
    row[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'checkbox') tr.classList.toggle('dim', !el.checked);
    if (S.roster.bad[i]) { delete S.roster.bad[i]; tr.classList.remove('bad'); }
    S.roster.dirty = true; updateSum();
    return;
  }
  if (el.id === 'ev-q') { S.evQ = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('ev-q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (el.id === 'af-q') { S.aggF.q = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('af-q'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'af-status') { S.aggF.status = el.value; render(); }
  if (el.id === 'af-event') { S.aggF.event = el.value; render(); }
  if (el.id === 'af-grade') { S.aggF.grade = el.value; render(); }
});
document.addEventListener('keydown', ev => {
  // 명단 입력 중 마지막 줄 이름 칸에서 Enter → 새 줄
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.f === 'name' && S.view === 'roster') {
    ev.preventDefault();
    const i = Number(ev.target.closest('tr').dataset.i);
    if (i === S.roster.rows.length - 1) { S.roster.rows.push(blankRow()); S.roster.dirty = true; render(); }
    const rows = document.querySelectorAll('table.roster tbody tr');
    const next = rows[i + 1] && rows[i + 1].querySelector('input[data-f=name]'); if (next) next.focus();
  }
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'pw-form') return;
  ev.preventDefault();
  const o = document.getElementById('pw-old').value, n1 = document.getElementById('pw-new').value, n2 = document.getElementById('pw-new2').value, err = document.getElementById('pw-err');
  if (n1.length < 6) { err.textContent = '새 비밀번호는 6자 이상으로 정하세요.'; return; }
  if (n1 !== n2) { err.textContent = '새 비밀번호 확인이 일치하지 않습니다.'; return; }
  api('changePassword', o, n1).then(() => { S.pw = n1; toast('비밀번호를 변경했습니다.'); render(); }).catch(e => { err.textContent = e.message; });
});
window.addEventListener('beforeunload', ev => { if (S.view === 'roster' && S.roster && S.roster.dirty) { ev.preventDefault(); ev.returnValue = ''; } });

/* ================= 미리보기(데모)용 가짜 서버 ================= */
const Mock = (function () {
  const y = today.getFullYear(), m = today.getMonth();
  const k = d => keyOf(y, m, d);
  // 미리보기용: 비밀번호 원문 대신 해시값만 둡니다.
  const h = s => { let x = 5381; for (const c of String(s)) x = ((x * 33) ^ c.charCodeAt(0)) >>> 0; return x; };
  let pwHash = 1468126193, seq = 10;
  const ev = [
    { id: 'E1', date: k(8), name: '과학탐구 토론대회 예선', dept: '과학교육부', teacher: '김민준', status: '신청중', confirmedAt: '' },
    { id: 'E2', date: k(15), name: '진로체험의 날 (대학 탐방)', dept: '진로진학부', teacher: '박지훈', status: '확정', confirmedAt: k(10) + ' 16:20:05' },
    { id: 'E3', date: k(15), name: '학생자치회 정기회의', dept: '창의인성부', teacher: '이서연', status: '신청중', confirmedAt: '' },
    { id: 'E4', date: k(22), name: '수학 골든벨', dept: '교육과정부', teacher: '박지훈', status: '신청중', confirmedAt: '' },
    { id: 'E5', date: k(28), name: '독서토론 한마당', dept: '교육연구부', teacher: '최유나', status: '신청중', confirmedAt: '' }
  ];
  const st = [
    ['E2', 1, 2, 3, '예시학생A', 'Y'], ['E2', 1, 2, 11, '예시학생B', 'Y'], ['E2', 1, 4, 7, '예시학생C', 'N'], ['E2', 2, 1, 5, '예시학생D', 'Y'], ['E2', 2, 3, 19, '예시학생E', 'Y'],
    ['E4', 1, 2, 3, '예시학생A', 'Y'], ['E4', 1, 3, 8, '예시학생F', 'Y'], ['E4', 2, 5, 14, '예시학생G', 'Y'],
    ['E1', 2, 1, 5, '예시학생D', 'Y'], ['E1', 3, 2, 21, '예시학생H', 'Y']
  ];
  const now = () => { const d = new Date(); return keyOf(d.getFullYear(), d.getMonth(), d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const chk = p => { if (h(p) !== pwHash) throw new Error('관리자 비밀번호가 맞지 않습니다.'); };
  const events = () => ev.map(e => {
    const s = st.filter(r => r[0] === e.id);
    return Object.assign({}, e, { applied: s.length, selected: s.filter(r => r[5] !== 'N').length });
  }).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const clean = e => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) throw new Error('날짜를 선택하세요.');
    if (!e.name || !e.dept || !e.teacher) throw new Error('모든 칸을 입력하세요.');
    return { date: e.date, name: e.name, dept: e.dept, teacher: e.teacher };
  };
  const roster = id => {
    const e = events().find(x => x.id === id); if (!e) throw new Error('행사를 찾을 수 없습니다.');
    return { event: e, students: st.filter(r => r[0] === id).map(r => ({ grade: r[1], cls: r[2], num: r[3], name: r[4], selected: r[5] !== 'N' })) };
  };
  const save = (id, a, list, confirm) => {
    const e = ev.find(x => x.id === id); if (!e) throw new Error('행사를 찾을 수 없습니다.');
    const admin = !!(a && a.pw) && h(a.pw) === pwHash;
    if (!admin) {
      if (norm(e.teacher) !== norm(a && a.name)) throw new Error('담당교사로 지정된 선생님만 이 명단을 수정할 수 있습니다.');
      if (e.status === '확정') throw new Error('이미 최종확정된 명단입니다.');
    }
    for (let i = st.length - 1; i >= 0; i--) if (st[i][0] === id) st.splice(i, 1);
    list.forEach(s => st.push([id, s.grade, s.cls, s.num, s.name, s.selected ? 'Y' : 'N']));
    if (confirm) { e.status = '확정'; e.confirmedAt = now(); }
    return roster(id);
  };
  return {
    getEvents: events,
    logConsent: () => true,
    adminLogin: p => { chk(p); return true; },
    changePassword: (o, n) => { chk(o); pwHash = h(n); return true; },
    addEvent: (e) => { ev.push(Object.assign({ id: 'E' + (++seq), status: '신청중', confirmedAt: '' }, clean(e))); return events(); },
    updateEvent: (p, id, e) => { chk(p); Object.assign(ev.find(x => x.id === id), clean(e)); return events(); },
    deleteEvent: (p, id) => { chk(p); ev.splice(ev.findIndex(x => x.id === id), 1); for (let i = st.length - 1; i >= 0; i--) if (st[i][0] === id) st.splice(i, 1); return events(); },
    unconfirm: (p, id) => { chk(p); const e = ev.find(x => x.id === id); e.status = '신청중'; e.confirmedAt = ''; return events(); },
    getRoster: roster,
    saveRoster: (id, a, l) => save(id, a, l, false),
    confirmRoster: (id, a, l) => save(id, a, l, true),
    getAggregate: p => {
      chk(p); const map = {}; events().forEach(e => { map[e.id] = e; });
      return st.filter(r => map[r[0]]).map(r => {
        const e = map[r[0]];
        return { grade: r[1], cls: r[2], num: r[3], name: r[4], eventId: e.id, eventName: e.name, date: e.date, dept: e.dept, teacher: e.teacher, selected: r[5] !== 'N',
          status: e.status === '확정' ? (r[5] !== 'N' ? '확정' : '미선정') : '신청' };
      }).sort((a, b) => (a.grade - b.grade) || (a.cls - b.cls) || (a.num - b.num) || (a.date < b.date ? -1 : 1));
    }
  };
})();

/* ================= 시작 ================= */
document.getElementById('demo').hidden = !!HAS_GAS;
api('getEvents').then(evs => { S.events = evs; render(); }).catch(e => {
  document.getElementById('view').innerHTML = '<div class="empty" style="padding:40px">행사 정보를 불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
});
</script>
